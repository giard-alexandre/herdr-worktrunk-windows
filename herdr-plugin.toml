id = "worktrunk.windows"
name = "Worktrunk for Windows"
version = "0.1.0"
min_herdr_version = "0.8.0"
description = "Switch, create, remove, or merge Git worktrees through Worktrunk on Windows"
platforms = ["windows"]

# Workspace actions launch from the plugin root. Open.ps1 passes the invoking
# repository to the transient pane through WORKTRUNK_REPO_CWD, allowing every
# manifest command to remain an argv array without interpolated PowerShell.
[[actions]]
id = "open"
title = "Worktree: switch / create from default branch"
contexts = ["workspace"]
command = ["powershell.exe", "-NoLogo", "-NoProfile", "-ExecutionPolicy", "Bypass", "-File", "scripts/Open.ps1", "picker-default"]

[[actions]]
id = "open-current"
title = "Worktree: switch / create from current branch"
contexts = ["workspace"]
command = ["powershell.exe", "-NoLogo", "-NoProfile", "-ExecutionPolicy", "Bypass", "-File", "scripts/Open.ps1", "picker-current"]

[[actions]]
id = "open-with-remotes"
title = "Worktree: switch / create from local or remote branches"
contexts = ["workspace"]
command = ["powershell.exe", "-NoLogo", "-NoProfile", "-ExecutionPolicy", "Bypass", "-File", "scripts/Open.ps1", "picker-with-remotes"]

[[actions]]
id = "remove"
title = "Worktree: remove"
contexts = ["workspace"]
command = ["powershell.exe", "-NoLogo", "-NoProfile", "-ExecutionPolicy", "Bypass", "-File", "scripts/Open.ps1", "remover"]

[[actions]]
id = "merge"
title = "Worktree: merge into the target branch"
contexts = ["workspace"]
command = ["powershell.exe", "-NoLogo", "-NoProfile", "-ExecutionPolicy", "Bypass", "-File", "scripts/Open.ps1", "merger"]

[[actions]]
id = "merge-no-squash"
title = "Worktree: merge into the target branch, keeping every commit"
contexts = ["workspace"]
command = ["powershell.exe", "-NoLogo", "-NoProfile", "-ExecutionPolicy", "Bypass", "-File", "scripts/Open.ps1", "merger-no-squash"]

[[panes]]
id = "picker-default"
title = "Worktrunk — default branch"
placement = "split"
command = ["powershell.exe", "-NoLogo", "-NoProfile", "-ExecutionPolicy", "Bypass", "-File", "scripts/Picker.ps1", "default"]

[[panes]]
id = "picker-current"
title = "Worktrunk — current branch"
placement = "split"
command = ["powershell.exe", "-NoLogo", "-NoProfile", "-ExecutionPolicy", "Bypass", "-File", "scripts/Picker.ps1", "current"]

[[panes]]
id = "picker-with-remotes"
title = "Worktrunk — local and remote branches"
placement = "split"
command = ["powershell.exe", "-NoLogo", "-NoProfile", "-ExecutionPolicy", "Bypass", "-File", "scripts/Picker.ps1", "remotes"]

[[panes]]
id = "remover"
title = "Worktrunk — remove"
placement = "split"
command = ["powershell.exe", "-NoLogo", "-NoProfile", "-ExecutionPolicy", "Bypass", "-File", "scripts/Remove.ps1"]

[[panes]]
id = "merger"
title = "Worktrunk — merge"
placement = "split"
command = ["powershell.exe", "-NoLogo", "-NoProfile", "-ExecutionPolicy", "Bypass", "-File", "scripts/Merge.ps1"]

[[panes]]
id = "merger-no-squash"
title = "Worktrunk — merge (no squash)"
placement = "split"
command = ["powershell.exe", "-NoLogo", "-NoProfile", "-ExecutionPolicy", "Bypass", "-File", "scripts/Merge.ps1", "-NoSquash"]
